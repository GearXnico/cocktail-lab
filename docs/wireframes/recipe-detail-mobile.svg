<text x="0" y="340.6" font-size="18" font-weight="bold" fill="#222">Method</text>
<text x="0" y="366.6" font-size="14" font-weight="bold" fill="#444">1.</text>
<text x="22" y="366.6" font-size="14" fill="#444">Pour all ingredients into a cocktail shaker</text>
<text x="22" y="386.90000000000003" font-size="14" fill="#444">filled with ice. Shake well.</text>
<text x="0" y="413.20000000000005" font-size="14" font-weight="bold" fill="#444">2.</text>
<text x="22" y="413.20000000000005" font-size="14" fill="#444">Strain into an old fashioned glass filled</text>
<text x="22" y="433.50000000000006" font-size="14" fill="#444">with ice (the IBA spec uses a cobbler</text>
<text x="22" y="453.80000000000007" font-size="14" fill="#444">glass, or this "on the rocks" serve).</text>
