<text x="1240" y="274" font-size="14" font-weight="bold" text-anchor="end" fill="#222">—</text>
<text x="876" y="298" font-size="14" fill="#444">Cost % · Margin</text>
<text x="1240" y="298" font-size="14" text-anchor="end" fill="#222">— · —</text>
<text x="876" y="322" font-size="11" fill="#888">Target cost 25 % · tax 19 % included · rounded up to 100</text>
