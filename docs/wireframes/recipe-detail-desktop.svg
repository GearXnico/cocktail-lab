<text x="0" y="286.3" font-size="18" font-weight="bold" fill="#222">Method</text>
<text x="0" y="312.3" font-size="14" font-weight="bold" fill="#444">1.</text>
<text x="22" y="312.3" font-size="14" fill="#444">Pour all ingredients into a cocktail shaker filled with ice. Shake well.</text>
<text x="0" y="338.6" font-size="14" font-weight="bold" fill="#444">2.</text>
<text x="22" y="338.6" font-size="14" fill="#444">Strain into an old fashioned glass filled with ice (the IBA spec uses a</text>
<text x="22" y="358.90000000000003" font-size="14" fill="#444">cobbler glass, or this "on the rocks" serve).</text>
