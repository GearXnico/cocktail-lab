<text x="24" y="684" font-size="18" font-weight="bold" fill="#222">History</text>
<text x="24" y="712" font-size="14" fill="#444">Whiskey sours are documented in the United States from the 19th century; the</text>
<text x="24" y="732.3" font-size="14" fill="#444">earliest known printed recipe appears in an 1862 book by Jerry Thomas.</text>
<text x="24" y="766.6" font-size="13" text-decoration="underline" fill="#444">Source: iba-world.com/iba-cocktail/whiskey-sour</text>
